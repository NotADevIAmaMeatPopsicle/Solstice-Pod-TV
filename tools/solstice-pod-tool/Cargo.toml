[package]
name = "pod-patcher"
version = "0.1.0"
edition = "2021"
description = "Pod Patcher: cross-platform native flasher, upgrader, app picker, and backup/restore tool for Mersive Solstice Pod Gen3 (SP8096)"
license = "Apache-2.0"

[[bin]]
name = "PodPatcher"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
rfd = "0.15"
directories = "5"
regex = "1"
chrono = "0.4"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
