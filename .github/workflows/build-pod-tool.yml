name: Build Solstice Pod Tool (Windows / macOS / Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: solstice-pod-tool-windows-x64.exe
            bin: target/release/solstice-pod-tool.exe
          - os: macos-latest
            artifact: solstice-pod-tool-macos-arm64
            bin: target/release/solstice-pod-tool
          - os: ubuntu-latest
            artifact: solstice-pod-tool-linux-x64
            bin: target/release/solstice-pod-tool

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        working-directory: tools/solstice-pod-tool
        run: cargo build --release

      - name: Upload standalone binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: tools/solstice-pod-tool/${{ matrix.bin }}
